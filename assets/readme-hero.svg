<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title description">
  <title id="title">research-agents workflow</title>
  <desc id="description">A visual research pipeline connecting ideas and papers to evidence, experiments, analysis, and publication.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c1a"/>
      <stop offset="0.55" stop-color="#101936"/>
      <stop offset="1" stop-color="#071d29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#background)"/>
  <rect width="1280" height="420" rx="28" fill="url(#grid)"/>
  <ellipse cx="300" cy="40" rx="420" ry="300" fill="url(#violetGlow)"/>
  <ellipse cx="1120" cy="370" rx="430" ry="300" fill="url(#cyanGlow)"/>

  <g transform="translate(76 78)">
    <rect width="220" height="30" rx="15" fill="#818cf8" fill-opacity="0.14" stroke="#a5b4fc" stroke-opacity="0.55"/>
    <circle cx="17" cy="15" r="4" fill="#818cf8"/>
    <text x="31" y="20" fill="#c7d2fe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">RESEARCH WORKFLOW</text>

    <text x="0" y="93" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="750" letter-spacing="-1.5">From uncertainty</text>
    <text x="0" y="147" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="750" letter-spacing="-1.5">to defensible evidence.</text>

    <text x="2" y="193" fill="#aab7cc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Composable skills for rigorous, repository-centered research.</text>

    <g transform="translate(0 236)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="650" letter-spacing="0.8">
      <text x="0" y="0" fill="#a5b4fc">DESIGN</text>
      <text x="68" y="0" fill="#475569">→</text>
      <text x="94" y="0" fill="#7dd3fc">GROUND</text>
      <text x="173" y="0" fill="#475569">→</text>
      <text x="199" y="0" fill="#67e8f9">BUILD</text>
      <text x="256" y="0" fill="#475569">→</text>
      <text x="282" y="0" fill="#5eead4">EVALUATE</text>
      <text x="373" y="0" fill="#475569">→</text>
      <text x="399" y="0" fill="#86efac">PUBLISH</text>
    </g>
  </g>

  <g transform="translate(895 210)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g stroke="#64748b" stroke-width="1.5" stroke-opacity="0.65">
      <path d="M0 0L-128-93"/>
      <path d="M0 0L130-92"/>
      <path d="M0 0L-151 52"/>
      <path d="M0 0L151 53"/>
      <path d="M0 0L-91 126"/>
      <path d="M0 0L93 126"/>
    </g>

    <circle r="72" fill="#111c35" stroke="url(#accent)" stroke-width="2.5"/>
    <circle r="58" fill="none" stroke="#94a3b8" stroke-opacity="0.16"/>
    <circle r="7" fill="#38bdf8" filter="url(#softGlow)"/>
    <text y="27" fill="#e2e8f0" font-size="12" font-weight="750" text-anchor="middle" letter-spacing="2">EVIDENCE</text>

    <g transform="translate(-128 -93)">
      <circle r="39" fill="#211b4b" stroke="#818cf8" stroke-width="1.5"/>
      <path d="M-11 4L0-12L11 4L0 13Z" fill="none" stroke="#c7d2fe" stroke-width="2"/>
      <text y="57" fill="#a5b4fc" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.3">IDEA</text>
    </g>
    <g transform="translate(130 -92)">
      <circle r="39" fill="#102c49" stroke="#38bdf8" stroke-width="1.5"/>
      <path d="M-12-14H7L14-7V14H-12Z M7-14V-7H14" fill="none" stroke="#bae6fd" stroke-width="2" stroke-linejoin="round"/>
      <text y="57" fill="#7dd3fc" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.3">PAPERS</text>
    </g>
    <g transform="translate(-151 52)">
      <circle r="39" fill="#112c3c" stroke="#22d3ee" stroke-width="1.5"/>
      <path d="M-15-8H15M-15 0H15M-15 8H15" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-7" cy="-8" r="3" fill="#22d3ee"/><circle cx="7" cy="0" r="3" fill="#22d3ee"/><circle cx="-2" cy="8" r="3" fill="#22d3ee"/>
      <text y="57" fill="#67e8f9" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.3">CONFIGS</text>
    </g>
    <g transform="translate(151 53)">
      <circle r="39" fill="#0d3233" stroke="#2dd4bf" stroke-width="1.5"/>
      <path d="M-12 12V-10M0 12V-1M12 12V-17" stroke="#99f6e4" stroke-width="4" stroke-linecap="round"/>
      <text y="57" fill="#5eead4" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.3">RUNS</text>
    </g>
    <g transform="translate(-91 126)">
      <circle r="39" fill="#123129" stroke="#4ade80" stroke-width="1.5"/>
      <path d="M-14 10L-5 1L2 6L14-11" fill="none" stroke="#bbf7d0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="57" fill="#86efac" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.3">ANALYSIS</text>
    </g>
    <g transform="translate(93 126)">
      <circle r="39" fill="#2e2920" stroke="#fbbf24" stroke-width="1.5"/>
      <path d="M-13-14H6L13-7V14H-13Z M6-14V-7H13M-7 1H7M-7 7H4" fill="none" stroke="#fde68a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <text y="57" fill="#fde68a" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.3">PAPER</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="27.25" fill="none" stroke="#94a3b8" stroke-opacity="0.16" stroke-width="1.5"/>
</svg>
